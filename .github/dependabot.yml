version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Dubai
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    groups:
      compatible-runtime-updates:
        update-types: [minor, patch]
    labels: [dependencies, security]
