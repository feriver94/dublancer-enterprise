name: Browser compatibility and accessibility

on:
  pull_request:
  push:
    branches: [master, release-certification]

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.project }} real-browser release journey
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: mobile-chrome
            browser: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate protected release environment
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 48)"
          redis_password="$(openssl rand -hex 48)"
          auth_secret="$(openssl rand -hex 48)"
          publisher_secret="$(openssl rand -hex 48)"
          notification_secret="$(openssl rand -hex 48)"
          email_secret="$(openssl rand -hex 48)"
          worker_secret="$(openssl rand -hex 48)"
          identity_key="$(openssl rand -hex 32)"
          mfa_pepper="$(openssl rand -hex 48)"
          integration_pepper="$(openssl rand -hex 48)"
          cache_secret="$(openssl rand -hex 48)"
          for value in "$db_password" "$redis_password" "$auth_secret" "$publisher_secret" "$notification_secret" "$email_secret" "$worker_secret" "$identity_key" "$mfa_pepper" "$integration_pepper" "$cache_secret"; do
            echo "::add-mask::$value"
          done
          {
            echo "DB_PASSWORD=$db_password"
            echo "REDIS_PASSWORD=$redis_password"
            echo "DATABASE_URL=postgresql://dublancer_release:$db_password@127.0.0.1:5432/dublancer_release?schema=public"
            echo "REDIS_URL=redis://:$redis_password@127.0.0.1:6379"
            echo "APP_BASE_URL=https://release-ci.example.test"
            echo "AUTH_SECRET=$auth_secret"
            echo "INTERNAL_PUBLISHER_SECRET=$publisher_secret"
            echo "INTERNAL_NOTIFICATION_SECRET=$notification_secret"
            echo "INTERNAL_EMAIL_SECRET=$email_secret"
            echo "INTERNAL_WORKER_SECRET=$worker_secret"
            echo "INTERNAL_CHAT_MAINTENANCE_SECRET=$worker_secret"
            echo "IDENTITY_ENCRYPTION_KEY=$identity_key"
            echo "MFA_BACKUP_CODE_PEPPER=$mfa_pepper"
            echo "INTEGRATION_API_KEY_PEPPER=$integration_pepper"
            echo "CACHE_INVALIDATION_SECRET=$cache_secret"
            echo "OTEL_EXPORTER_OTLP_ENDPOINT=https://otel.release-ci.example.test"
            echo "DEPLOYMENT_REGION=uae-north"
            echo "DEPLOYMENT_REGIONS=uae-north,europe-west"
            echo "DISASTER_RECOVERY_REGION=europe-west"
            echo "APP_VERSION=$GITHUB_SHA"
            echo "NODE_ENV=production"
            echo "DEPLOYMENT_ENVIRONMENT=production"
            echo "EXPOSE_DEVELOPMENT_TOKENS=false"
            echo "WEBAUTHN_ORIGIN=https://release-ci.example.test"
            echo "WEBAUTHN_RP_ID=release-ci.example.test"
            echo "WEBAUTHN_RP_NAME=Dublancer Release CI"
            echo "NEXT_TELEMETRY_DISABLED=1"
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
      - name: Start native PostgreSQL and real Redis
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name dublancer-release-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=dublancer_release \
            --env POSTGRES_PASSWORD="$DB_PASSWORD" \
            --env POSTGRES_DB=dublancer_release \
            postgres:18-alpine
          docker run --detach --name dublancer-release-redis \
            --publish 127.0.0.1:6379:6379 \
            --env REDIS_PASSWORD="$REDIS_PASSWORD" \
            redis:8.2-alpine sh -c 'exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"'
          for attempt in $(seq 1 60); do
            if docker exec dublancer-release-postgres pg_isready -U dublancer_release -d dublancer_release >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec dublancer-release-postgres pg_isready -U dublancer_release -d dublancer_release
          for attempt in $(seq 1 60); do
            if docker exec --env REDISCLI_AUTH="$REDIS_PASSWORD" dublancer-release-redis redis-cli PING 2>/dev/null | grep -qx PONG; then break; fi
            sleep 1
          done
          docker exec --env REDISCLI_AUTH="$REDIS_PASSWORD" dublancer-release-redis redis-cli PING | grep -qx PONG
      - run: npm ci --include=dev
      - name: Apply native migrations and authoritative seed
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
      - name: Install ${{ matrix.browser }} browser and operating-system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build and start standalone production application
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          HOSTNAME=127.0.0.1 PORT=3000 npm run start > "$RUNNER_TEMP/dublancer-application.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/dublancer-application.pid"
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health/live >/dev/null
          curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null
      - name: Execute all 10 ${{ matrix.project }} assertions
        run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.project }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            test-results/playwright
            playwright-report
            ${{ runner.temp }}/dublancer-application.log
      - name: Stop disposable environment
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/dublancer-application.pid" ]; then kill "$(cat "$RUNNER_TEMP/dublancer-application.pid")" 2>/dev/null || true; fi
          docker rm --force dublancer-release-redis dublancer-release-postgres >/dev/null 2>&1 || true
