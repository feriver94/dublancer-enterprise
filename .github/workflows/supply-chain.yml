name: Supply-chain verification

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://dublancer_test:dublancer_test@127.0.0.1:5432/dublancer_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Materialize lockfile without executing lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify registry sources, integrity and lifecycle allowlist
        run: npm run verify:supply-chain
      - name: Reject production advisories
        run: npm run audit:production
      - name: Execute reviewed lifecycle scripts
        run: npm rebuild
      - name: Verify generated client and application contracts
        run: npx prisma generate && npm test && npm run typecheck
